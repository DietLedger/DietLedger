services:
  postgres:
    image: postgres:17-alpine
    container_name: dietledger-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dietledger}
      POSTGRES_USER: ${POSTGRES_USER:-dietledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dietledger}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dietledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: recipetool-api
    container_name: dietledger-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-dietledger}:${POSTGRES_PASSWORD:-dietledger}@postgres:5432/${POSTGRES_DB:-dietledger}?sslmode=disable
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000},http://dietledger-web:3000
      - HMAC_SECRET=${HMAC_SECRET:-}
      - JWT_SIGNING_KEY_PATH=${JWT_SIGNING_KEY_PATH:-}
      - MAX_BODY_MB=${MAX_BODY_MB:-10}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: recipetool-dietledger
    container_name: dietledger-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER=1
      - API_URL=http://dietledger-api:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pg-data:

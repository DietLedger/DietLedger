<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DietLedger</title>
<style>html,body{margin:0;background:#102e28}</style>
</head>
<body>
<main id="preview"></main>

<template id="ledger-shell">
<style>
  :host {
    display:block; container-type:inline-size;
    background:var(--emerald); color:var(--cream);
    font:16px/1.45 system-ui,sans-serif;
  }
  *,*::before,*::after { box-sizing:border-box; }
  .book {
    min-height:100svh;
    background:radial-gradient(ellipse at 51% 37%,#c2cf8724,transparent 53%),
               linear-gradient(115deg,#00000015,transparent 45%,#00000024);
  }
  .page { width:min(100%,var(--width)); margin:auto; padding:20px clamp(16px,4cqi,48px) 16px; }
  .mast,.brand { display:flex; align-items:center; }
  .mast { gap:14px; }
  .brand { gap:8px; font:22px Georgia,serif; }
  .brand svg { width:34px; height:34px; }
  .rule { flex:1; height:1px; background:#efd4a53c; }
  header { text-align:center; margin:clamp(20px,3cqi,37px) auto 0; }
  h1,h2,.label,.times { font-family:Georgia,"Times New Roman",serif; font-weight:normal; }
  h1 { margin:0; font-size:var(--heading); line-height:1.04; letter-spacing:-.048em; text-wrap:balance; }
  h1 em { color:#f1cb91; }
  header p { color:#d4ddce; margin:12px auto 0; text-wrap:balance; }
  .stage { width:100%; display:block; overflow:visible; }
  h2 { display:flex; align-items:center; gap:18px; margin:3px 0 18px; text-align:center; font-size:clamp(22px,3cqi,32px); line-height:1.2; }
  h2::before,h2::after { content:""; flex:1; height:1px; background:#e2c99a4a; }
  .choices { display:grid; grid-template-columns:repeat(var(--columns),minmax(0,1fr)); gap:14px; }
  .choice {
    appearance:none; width:100%; display:grid; grid-template-columns:auto 1fr;
    align-content:start; text-align:left; padding:13px 18px 20px;
    border:1px solid #cdb68a; border-radius:6px;
    background:linear-gradient(140deg,#fff8e6,#efe2c6); color:#223b30;
    box-shadow:0 4px 9px #06150e35; font:inherit; cursor:pointer;
  }
  .choice:hover,.choice[aria-pressed=true] { background:#fff7df; border-color:#fff0bb; }
  .choice[aria-pressed=true] { box-shadow:inset 0 0 0 3px #9f693c; }
  button:focus-visible,h1:focus-visible { outline:3px solid #ffcf78; outline-offset:4px; }
  .portrait { display:block; width:78px; height:62px; overflow:visible; }
  .arrow { justify-self:end; align-self:center; font-size:21px; color:#765637; }
  .label { grid-column:1/-1; margin:5px 0; font-size:clamp(21px,2.6cqi,29px); line-height:1.12; }
  .desc { grid-column:1/-1; color:#425246; font-size:.91rem; }
  .branches .choice { grid-template-columns:82px 1fr 18px; column-gap:14px; align-content:center; }
  .branches .portrait { grid-column:1; grid-row:1/3; align-self:center; }
  .branches .label,.branches .desc { grid-column:2; }
  .branches .label { grid-row:1; }
  .branches .desc { grid-row:2; }
  .branches .arrow { grid-column:3; grid-row:1/3; }
  footer { display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px; margin-top:10px; }
  .status { color:#e9d4ac; font-size:.86rem; margin:0 auto 0 0; }
  .controls { margin-left:auto; display:flex; flex-wrap:wrap; gap:5px; }
  .controls button {
    color:#e0e4d6; font:inherit; font-size:.86rem; min-height:44px;
    padding:0 10px; border:0; background:transparent; cursor:pointer;
  }
  .controls button:hover { text-decoration:underline; }
  .controls .setup { color:#f1cb91; }
  .defs { position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
  .wire,.trace { stroke:var(--copper); fill:none; stroke-linecap:round; stroke-dasharray:1; }
  .wire { stroke-width:2; }
  .trace { stroke-width:2.6; }
  .terminal { fill:var(--copper); }

  /* S1 only. The HTML labels share the SVG's 1/6, 1/2, 5/6 positions. */
  /* S1 meal selector and S2 recipe stationery */
  .meal-times {display:flex;justify-content:space-around;position:relative;margin:22px auto 0;max-width:38rem}
  .meal-times::before {content:"";position:absolute;left:25%;right:25%;bottom:11px;border-bottom:1px solid var(--copper)}
  .meal-times button {position:relative;display:grid;justify-items:center;gap:8px;padding:4px 14px 6px;background:none;border:none;color:var(--cream);font:1.1rem Georgia,serif;cursor:pointer}
  .meal-times button::after {content:"";width:12px;height:12px;border-radius:50%;background:#809587;border:1px solid #efd1a2}
  .meal-times [aria-pressed=true]::after {background:var(--copper);outline:1px solid var(--copper);outline-offset:3px}
  .recipe header p {max-width:47rem}
  .papers {display:grid;grid-template-columns:minmax(0,1.3fr) 44px minmax(0,1fr);align-items:center;margin:28px auto;max-width:54rem}
  .sheet {padding:clamp(18px,3cqi,32px);color:#253e32;background:linear-gradient(125deg,#fffaeb,#f2e3c5);border:1px solid #cfba93;border-radius:3px 9px 4px 3px;box-shadow:2px 3px #bca988,4px 6px #6c6950,0 10px 20px #07191244;transform-origin:left center}
  .sheet h2,.sheet h3 {display:block;text-align:left;margin:8px 0;font:normal clamp(24px,3cqi,34px)/1.08 Georgia,serif}
  .sheet h2::before,.sheet h2::after {display:none}
  .sheet h3 {font-size:1.15rem}
  .kicker {margin:0;font:600 .88rem system-ui;color:#496150}
  .recipe-art {display:block;width:100%;height:auto;margin:6px 0}
  .sheet ul {padding-left:1.2rem;margin:8px 0 14px}.sheet li {margin:3px 0}
  .sheet dl,.sheet dd {margin:0}.sheet dl div {display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #c9b99f}
  .sheet dd {font-weight:600}.sheet .portion {border-top:1px solid #bda982;padding-top:11px;margin:0}
  .connector {width:100%;height:32px}
  @container(max-width:640px){.papers{grid-template-columns:1fr;max-width:30rem}.connector{width:34px;transform:rotate(90deg);justify-self:center}}
  /* S3: ring-bound menu, loose recipe leaves, and the counter below them. */
  .menu header p {max-width:44rem}
  .menu .papers {max-width:59rem;grid-template-columns:minmax(0,1.35fr) 52px minmax(0,1fr);margin-bottom:0}
  .menu-book {position:relative;background:linear-gradient(105deg,#f2e1bc,#fff7e3 9%,#f3e5c9);border-bottom:4px solid #7d6547}
  .menu-book::before,.menu-book::after {content:"";position:absolute;top:-9px;width:11px;height:20px;border:3px solid #ab764a;border-radius:50%;box-shadow:inset 1px 0 #f2ca91,1px 1px #73604a}
  .menu-book::before {left:14%}.menu-book::after {right:14%}
  .recipe-leaves {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .menu-leaf {display:flex;flex-direction:column;padding:12px 10px;color:#2c493c;background:linear-gradient(115deg,#fffaf0,#f9eed6);border:1px solid #cabb9d;box-shadow:1px 3px 2px #6549252b}
  .menu-leaf:nth-child(1){rotate:-1deg}.menu-leaf:nth-child(2){rotate:1deg}
  .menu-leaf svg {width:100%;height:auto;display:block}
  .menu-leaf h3 {margin:4px 0 10px;line-height:1.15}
  .day-name {margin:0;border-bottom:1px solid #c8b592;padding-bottom:5px;font:italic 1rem Georgia,serif}
  .serving-mark {margin:auto 0 0;padding-top:6px;border-top:1px dashed #b5936a;font-size:.83rem}
  .menu .list-slip {padding-block:20px}
  .list-slip dl div {padding:5px 0;font-size:.92rem}
  .list-slip dd {white-space:nowrap}
  .prep-surface {width:100%;display:block;max-width:61rem;margin:0 auto}
  .review-note {margin:0 auto 20px;text-align:center;color:#f5dbb7;font:italic 1.05rem/1.45 Georgia,serif}
  @container(max-width:680px){
    .menu .papers {grid-template-columns:1fr;max-width:30rem;gap:4px}
    .menu .connector {width:36px;height:32px;transform:rotate(90deg);justify-self:center}
    .menu-leaf {padding:9px 7px}
  }
  @container(max-width:370px){.menu .sheet {padding-inline:12px}.recipe-leaves{gap:6px}}
  /* S4: the meal plan and lunch bench meet in an open kitchen notebook. */
  .pilot header p {max-width:46rem}
  .pilot-folio {position:relative;max-width:54rem;margin:28px auto 0;padding:9px;border:1px solid #728c74;border-radius:6px 15px 10px 5px;background:linear-gradient(125deg,#41675c,#24473e);box-shadow:1px 5px 0 #152d26,0 12px 22px #061c1640}
  .pilot-spread {display:grid;grid-template-columns:1.2fr 1fr;color:#293f32;background:#f8ecd4;border-radius:2px 9px 5px 2px;box-shadow:1px 3px #beab88}
  .pilot-spread section {padding:clamp(16px,2.6cqi,28px);min-width:0}
  .pilot-plan {background:linear-gradient(90deg,#fff7e5,#f9ecd2 92%,#dfceb0)}
  .pilot-review {background:linear-gradient(90deg,#e4d6b8,#fff5df 8%,#f6e8cb);border-left:1px solid #bbab89;border-radius:0 8px 4px 0}
  .pilot-folio h2 {display:block;text-align:left;font-size:clamp(24px,3cqi,32px);margin:6px 0 12px}
  .pilot-folio h2::before,.pilot-folio h2::after {display:none}
  .pilot-table {display:block;width:100%;margin:8px 0}
  .pilot-folio .recipe-leaves {margin-top:8px}
  .pilot-review p {margin:10px 0}
  .pilot-review .kicker {margin:0}
  .pilot-folio details {margin-top:16px;border-block:1px solid #ccba98;padding:9px 0}
  .pilot-folio summary {cursor:pointer;color:#285342;font-weight:600}
  .pilot-folio summary:focus-visible {outline:3px solid #84582d;outline-offset:3px}
  .pilot-folio details .sheet {padding:12px;margin:12px 0;box-shadow:none}
  .pilot-folio details .connector {display:none}
  .pilot-boundary {margin:0 auto 18px;max-width:52rem;padding:10px 16px;border-inline-start:2px solid var(--copper);color:var(--cream);background:#173b31}
  .pilot-boundary a {color:#f8d79e;text-underline-offset:3px}
  .pilot .prep-surface {max-width:57rem}
  @container(max-width:640px){.pilot-spread{grid-template-columns:1fr}.pilot-review{border-left:0;border-top:1px solid #bbab89}.pilot-folio{margin-top:18px}}
  /* H1 uses the pilot's paper, stoneware and oak worktop. */
  .hosting header p {max-width:47rem}
  .setup-arrival {display:block;width:min(360px,92%);margin:12px auto 4px}
  .hosting .choices {--columns:2;max-width:54rem;margin:auto}
  .hosting .choice {display:block;min-width:0;padding:15px 18px}
  .hosting .choice .label,.hosting .choice .desc {display:block}
  .hosting .choice .label {font-size:clamp(20px,2.5cqi,26px)}
  .hosting .choice .arrow {float:right}
  .hosting .choice:focus-visible {outline-color:#ffd38b}
  .setup-materials {max-width:54rem;margin:16px auto}
  .setup-materials a {color:#f8d79e;text-underline-offset:3px}
  .setup-materials a:focus-visible {outline:3px solid #e8a650;outline-offset:4px}
  .setup-materials .sheet a {color:#285642}
  .license-note {line-height:1.5;margin:12px 0}
  .hosting .pilot-boundary {max-width:none;margin:12px 0 18px}
  .host-page {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3cqi,32px);align-items:center}
  .host-figure {margin:0}
  .host-figure svg {width:100%;display:block}
  .host-captions {display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;font:1.1rem Georgia,serif}
  .host-captions small {display:block;font:.84rem/1.4 system-ui;margin-top:5px}
  .host-page p {margin:10px 0 14px}
  .setup-materials .sheet .guide-link {display:inline-block;background:#274e40;color:#fff6de;padding:11px 15px;border-radius:5px;text-decoration:none}
  .setup-materials .guide-link:hover {text-decoration:underline}
  @container(max-width:640px){.host-page{grid-template-columns:1fr}.hosting .choice{min-height:0}.hosting .choices{grid-template-columns:1fr}.host-figure{max-width:26rem;margin:auto}}
  .school h1 { max-width:18em; margin-inline:auto; }
  .school header p { max-width:42rem; }
  .times {
    display:grid; grid-template-columns:repeat(3,1fr); text-align:center;
    margin:clamp(18px,3cqi,36px) 0 0; padding:0;
    list-style:none; font-size:clamp(.9rem,1.9cqi,1.2rem); color:#d4ddce;
  }
  .times li:nth-child(2) { color:#ffdaa4; font-style:italic; }
  .closing { margin:0 auto 17px; max-width:44rem; text-align:center; text-wrap:balance; color:#e6e7d6; }
  .next {
    display:flex; justify-content:center; align-items:center; gap:22px;
    margin:0 auto; min-height:48px; padding:11px 22px; border:1px solid #cdb68a;
    border-radius:6px; background:linear-gradient(140deg,#fff8e6,#efe2c6);
    color:#223b30; cursor:pointer; font:1.17rem Georgia,serif;
  }
  .next:hover { background:#fff7df; }
  .school .scene-content { max-width:var(--lunchWidth); margin:auto; }
  [hidden] { display:none !important; }
  @container(max-width:640px) {
    .page { padding-inline:14px; }
    header p { max-width:30em; font-size:.94rem; }
    .stage { width:calc(100% + 16px); margin-inline:-8px; }
    .school .stage { width:100%; margin:0; }
    h2 { margin-bottom:12px; gap:8px; }
    .choices { grid-template-columns:1fr; gap:8px; }
    .choice,.branches .choice {
      grid-template-columns:64px 1fr 16px; column-gap:12px; align-content:center;
      padding:12px; min-height:84px;
    }
    .portrait { grid-column:1; grid-row:1/3; align-self:center; width:64px; height:54px; }
    .label,.desc { grid-column:2; }
    .label { grid-row:1; margin:0 0 3px; }
    .desc { grid-row:2; font-size:.85rem; }
    .arrow { grid-column:3; grid-row:1/3; }
    .controls { gap:0; }
    .closing { font-size:.94rem; margin-top:8px; }
  }
  @media(forced-colors:active) {
    .choice[aria-pressed=true] { border:3px solid Highlight; }
  }
</style>
<section class="book" aria-labelledby="headline">
<div class="page">
  <div class="mast">
    <span class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30" aria-hidden="true">
        <rect x="3" y="1" width="20" height="15" rx="0.8" fill="#F0DFC0" stroke="#3C2415" stroke-width="0.5"/>
        <rect x="5" y="5.5" width="16" height="2.5" rx="0.3" fill="#5B8C8E" opacity="0.4"/>
        <line x1="5" y1="10" x2="21" y2="10" stroke="#3C2415" stroke-width="0.3" opacity="0.3"/>
        <line x1="5" y1="12.5" x2="21" y2="12.5" stroke="#3C2415" stroke-width="0.3" opacity="0.3"/>
        <line x1="5" y1="15" x2="16" y2="15" stroke="#3C2415" stroke-width="0.3" opacity="0.3"/>
        <rect x="7" y="8" width="20" height="19" rx="0.8" fill="#F8ECD0" stroke="#3C2415" stroke-width="0.7"/>
        <rect x="13.5" y="5.5" width="7" height="4.5" rx="1.2" fill="#F8ECD0"/>
        <rect x="14" y="5.8" width="6" height="3.8" rx="1" fill="#F8ECD0" stroke="#3C2415" stroke-width="0.7"/>
        <line x1="14.2" y1="8" x2="19.8" y2="8" stroke="#F8ECD0" stroke-width="1.5"/>
        <rect x="9" y="11.5" width="16" height="2.5" rx="0.3" fill="#5B8C8E"/>
        <line x1="9" y1="17" x2="25" y2="17" stroke="#3C2415" stroke-width="0.8"/>
        <line x1="9" y1="19.5" x2="25" y2="19.5" stroke="#3C2415" stroke-width="0.35" opacity="0.45"/>
        <line x1="9" y1="21.8" x2="25" y2="21.8" stroke="#3C2415" stroke-width="0.35" opacity="0.45"/>
        <line x1="9" y1="24" x2="20" y2="24" stroke="#3C2415" stroke-width="0.35" opacity="0.45"/>
      </svg>
      DietLedger
    </span><span class="rule" aria-hidden="true"></span>
  </div>
  <header><h1 id="headline" tabindex="-1"></h1></header>
  <div class="scene-content">
    <div class="meal-times" role="group" aria-label="School meal" hidden>
      <button type="button" data-meal="breakfast" aria-pressed="false">Breakfast</button>
      <button type="button" data-meal="lunch" aria-pressed="true">Lunch</button>
    </div>
    <svg class="stage" aria-hidden="true" focusable="false"></svg>
    <h2 id="question"></h2>
    <div class="choices" role="group" aria-labelledby="question"></div>
    <div class="school-ending" hidden>
      <p class="closing">Thoughtful school lunches are a future worth working toward. Start by giving the people planning them better tools to work with.</p>
      <button type="button" class="next">Start behind the meal <span aria-hidden="true">→</span></button>
    </div>
  </div>
  <footer>
    <p class="status" role="status" aria-atomic="true"></p>
    <div class="controls">
      <button type="button" data-action="back">← Back</button>
      <button type="button" data-action="replay">↺ Replay</button>
      <button type="button" data-action="skip">Skip intro</button>
      <button type="button" data-action="restart">Restart</button>
      <button type="button" data-action="setup" class="setup">Set up DietLedger</button>
    </div>
  </footer>
</div>
</section>
</template>

<!-- EDITABLE ILLUSTRATION DETAILS. IDs are shared within a scene's shadow root.
     The table, stoneware, school lunch tray, and food are each drawn once. -->
<template id="ledger-art">
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
  <linearGradient id="oak" x2=".16" y2="1"><stop stop-color="#c68a56"/><stop offset=".52" stop-color="#dea573"/><stop offset="1" stop-color="#b9774a"/></linearGradient>
  <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#a3633d"/><stop offset=".55" stop-color="#804a32"/><stop offset="1" stop-color="#653b2a"/></linearGradient>
  <linearGradient id="linen" x2=".85" y2="1"><stop stop-color="#456f64"/><stop offset="1" stop-color="#254a42"/></linearGradient>
  <radialGradient id="china" cx=".36" cy=".25" r=".86">
    <stop stop-color="#fffbed"/><stop offset=".78" stop-color="#f4ead0"/><stop offset=".88" stop-color="#d6c9a9"/>
    <stop offset=".94" stop-color="#fff4d8"/><stop offset="1" stop-color="#d7c8a4"/>
  </radialGradient>
  <linearGradient id="fish" x2=".6" y2="1"><stop stop-color="#ffb277"/><stop offset=".55" stop-color="#e78151"/><stop offset="1" stop-color="#bc5638"/></linearGradient>
  <radialGradient id="meat" cx=".32" cy=".25" r=".85"><stop stop-color="#be7344"/><stop offset=".6" stop-color="#965033"/><stop offset="1" stop-color="#613123"/></radialGradient>
  <radialGradient id="butter" cx=".35" cy=".28" r=".8"><stop stop-color="#fff1bd"/><stop offset=".7" stop-color="#ead69b"/><stop offset="1" stop-color="#c5aa71"/></radialGradient>
  <radialGradient id="light"><stop stop-color="#ffe1a0" stop-opacity=".78"/><stop offset=".54" stop-color="#ffd085" stop-opacity=".44"/><stop offset="1" stop-color="#ffd085" stop-opacity="0"/></radialGradient>
  <linearGradient id="tray" x2=".18" y2="1"><stop stop-color="#b7d4ba"/><stop offset="1" stop-color="#719c86"/></linearGradient>
  <linearGradient id="bread" x2=".16" y2="1"><stop stop-color="#ffe5a8"/><stop offset="1" stop-color="#d99d5d"/></linearGradient>
  <radialGradient id="apple" cx=".3" cy=".24" r=".86"><stop stop-color="#f69465"/><stop offset=".48" stop-color="#cf5845"/><stop offset="1" stop-color="#933d35"/></radialGradient>
  <linearGradient id="windowlight" x2=".8" y2="1"><stop stop-color="#f8dea0"/><stop offset="1" stop-color="#9fb79c"/></linearGradient>
  <clipPath id="topClip"><ellipse cx="450" cy="123" rx="405" ry="86"/></clipPath>

  <g id="plate">
    <ellipse cx="1" cy="6" rx="61" ry="59" fill="#49321e" opacity=".33"/>
    <circle cy="2.5" r="60" fill="#a89b7c"/><circle r="60" fill="url(#china)" stroke="#8d8067"/>
    <circle r="55" fill="none" stroke="#587b70" stroke-width="1.8"/><circle r="52.3" fill="none" stroke="#81a094" stroke-width=".8"/>
    <circle r="43" fill="#fff5dd" stroke="#cfbf9c" stroke-width="1.3"/>
  </g>
  <g id="spear" stroke-linecap="round">
    <path d="M0 20Q-1 2 0-19" fill="none" stroke="#375334" stroke-width="4.8"/>
    <path d="M-.7 18Q-1 5-.4-14" fill="none" stroke="#94ac56" stroke-width="1.7"/>
    <path d="M0-24q-5 6-2 10l2-2 2 2q3-4-2-10" fill="#526742"/><path d="m-1-19 2 2-2 2" fill="none" stroke="#b2b16b"/>
  </g>
  <g id="salmon">
    <path d="M-16-21q9-6 21-3l13 39q-1 7-10 9l-21-2q-5-1-6-9Z" fill="#844e39"/>
    <path d="M-16-23q12-6 22-2l10 36q0 6-9 8l-21-1q-4-1-5-7Z" fill="url(#fish)" stroke="#ab633d" stroke-width="1.2"/>
    <path d="M-15-16q11 6 19-4m-19 13q12 6 22-6m-21 15q14 5 23-6m-21 15q14 4 22-6" fill="none" stroke="#ffce99" stroke-width="2.2" stroke-linecap="round"/>
    <path d="m-7-14 5 1m1 13 5-2m-15 9 5 1" stroke="#925638" stroke-width="2"/>
  </g>
  <g id="dish-personal">
    <use href="#plate"/>
    <g transform="translate(20 5) rotate(29)"><use href="#spear" x="-5" y="-2"/><use href="#spear"/><use href="#spear" x="5" y="3"/><use href="#spear" x="10" y="-1"/></g>

function sharedTable(scale) {
  const settings = MEALS.map(({key,x,y}) => `

    <ellipse class="trace" cx="450" cy="123" rx="405" ry="86" pathLength="1"/>${settings}`;
}

function branchStage(config) {
  const scale = config.branchTableScale;

    {x:225,art:"school-setting",top:22},
    {x:675,art:"dining-setting",top:3}

  const arms = ends.map(({x,art,top},i) => {
    const y = fork+34;
    return `<path class="wire arm" pathLength="1" d="M450 ${fork} C${i ? 510 : 390} ${fork},${x} ${fork-19},${x} ${y}"/>

      </g><circle class="terminal" cx="${x}" cy="${y}" r="2.8"/>`;
  }).join("");

    <path class="wire trunk" pathLength="1" d="M450 ${start}V${fork}"/>${arms}`;

function mountChooseSetup(container,options={}) { return mountScene(container,"hosting",options); }
function mountSchoolPilot(container,options={}) { return mountScene(container,"pilot",options); }
function mountMenuToCounter(container,options={}) { return mountScene(container,"menu",options); }
function mountRecipeConversation(container,options={}) { return mountScene(container,"recipe",options); }

function mountScene(container,kind,options) {
  const config = {...SETTINGS,...options};
  const host = document.createElement("div");
  const root = host.attachShadow({mode:"open"});
  root.append(document.querySelector("#ledger-art").content.cloneNode(true));
  root.append(document.querySelector("#ledger-shell").content.cloneNode(true));
  const find = selector => root.querySelector(selector);
  const all = selector => [...root.querySelectorAll(selector)];
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const animations = new Set();
  const branches = kind === "branches";
  const hosting = kind==="hosting";
  const arrival = hosting ? {...SCHOOL_SETUP_COPY,...options.arrival} : null;
  const pilot = kind === "pilot";
  const menu = kind === "menu";
  const recipe = kind === "recipe";
  const school = kind === "school";
  const beat = Math.max(0,Number((hosting || pilot || menu || recipe || school) ? config.schoolBeatMs : branches ? config.branchBeatMs : config.beatMs)||0);
  const stage = find(".stage");

  for (const key of ["emerald","cream","copper","width","heading","lunchWidth"]) {
    host.style.setProperty("--"+key,config[key]);
  }
  find(".book").classList.add(kind);
  const headlines = {
    pilot:"Tomorrow’s lunch starts with <em>what we try today.</em>",
    menu:"Connect the menu to <em>what needs preparing.</em>",
    recipe:"Put the recipe and the nutrition <em>in the same conversation.</em>",
    opening:"The next chapter starts <em>at your table.</em>",
    branches:"A good meal is an <em>everyday act of care.</em>",
    school:"What if lunch were something <em>to look forward to?</em>"
  };
  if (hosting) find("h1").textContent = arrival.headline;
  else find("h1").innerHTML = headlines[kind];
  if (!branches) {
    const p = document.createElement("p");
    p.textContent = hosting ? arrival.introduction : pilot ? "Start small. Explore a few recipes. Build a sample week. Invite the people who understand your kitchen to put the workflow to the test." : menu ? "Arrange recipes across a meal plan. Set planned servings and generate a combined ingredient list." : recipe ? "Build a collection of recipes. Review their ingredients, servings, and available nutrition. Keep the details visible while you consider what belongs on the menu." : school
      ? "Not just a pause between lessons. A filling meal. Food worth tasting. A chance to discover something good."
      : "Small decisions. Everyday meals. A future worth taking care of.";
    find("header").append(p);
    if (hosting) {
      const second = document.createElement("p");
      second.textContent = arrival.hosting;
      find("header").append(second);
    }
  }

  function skip() {
    for (const animation of animations) animation.cancel();
    animations.clear();
  }

  // One selection mechanism shared by O1, G1 and the S1 → S2 action.
  function choose(path,message) {
    skip();
    find(".status").textContent = message;
    container.dispatchEvent(new CustomEvent("dietledger:choose",{
      bubbles:true, composed:true, detail:{path}
    }));
    options.onChoose?.(path);
  }

  let meal = options.meal==="breakfast" ? "breakfast" : "lunch";
  if (hosting) {
    stage.classList.add("setup-arrival");
    stage.setAttribute("viewBox","0 0 400 119");
    // The cookbook rests on the counter. The small prep board sits to its right.
    stage.innerHTML = `<g stroke-linejoin="round" stroke-linecap="round">
      <use href="#counter-surface" transform="translate(0 70) scale(.435 .53)"/>
      <ellipse cx="159" cy="90" rx="78" ry="3" fill="#64432f" opacity=".27"/>
      <use href="#setup-notebook" transform="translate(153 63) skewX(-8) scale(1.15 1.32)"/>
      <g transform="translate(248 88) rotate(-2)">
        <ellipse cx="53" cy="10" rx="57" ry="3" fill="#64432f" opacity=".25"/>
        <path d="M0 0q0-3 5-3h77q4 0 6 3l3 2 17-1q5 0 5 3t-5 3H91l-4 4q-1 2-6 2H7q-6 0-6-4Z" fill="url(#edge)" stroke="#835936"/>
        <path d="M0-2q0-3 5-3h77q4 0 6 3l3 2 17-1q5 0 5 3t-5 3H91l-4 4q-1 2-6 2H7q-6 0-6-4Z" fill="url(#bread)" stroke="#a7794e"/>
        <ellipse cx="107" cy="2" rx="2.3" ry="1.2" fill="#916740"/>
        <path d="m7 7 16 .2m40 .4 18-.2" stroke="#c79a6b" fill="none"/>
        <use href="#slice" transform="translate(15 0) rotate(-8) scale(.82)"/>
        <use href="#slice" transform="translate(25 3) rotate(12) scale(.76)"/>
        <use href="#cucumber" transform="translate(45 0) rotate(-12) scale(.8)"/>
        <use href="#cucumber" transform="translate(54 3) rotate(10) scale(.78)"/>
        <use href="#basil" transform="translate(72 6) rotate(45) scale(.64)"/>
        <use href="#basil" transform="translate(72 6) rotate(-18) scale(.58)"/>
      </g>
    </g>`;
    find("#question").textContent = arrival.prompt;
    find(".choices").insertAdjacentHTML("afterend",setupMaterials());
    const routes = [
      ["beginner-guide","Help us understand the setup","Hosting requirements, responsibilities, and license eligibility."],
      ["technical-guide","Show our technical team the guide","Installation requirements and commands."]
    ];
    for (const [id,title,description] of routes) {
      const button = document.createElement("button");
      button.className = "choice";
      button.type = "button";
      button.setAttribute("aria-controls",id);
      button.setAttribute("aria-pressed",String(id==="beginner-guide"));
      button.innerHTML = `<span class="arrow" aria-hidden="true">↘</span><span class="label">${title}</span><span class="desc">${description}</span>`;
      find(".choices").append(button);
      button.addEventListener("click",() => {
        skip();
        for (const other of all(".choice")) {
          const active = other===button;
          other.setAttribute("aria-pressed",String(active));
          root.getElementById(other.getAttribute("aria-controls")).hidden = !active;
        }
        find(".status").textContent = title + " selected.";
      });
    }
    if (!options.hideChangePath) {
      const change = document.createElement("button");
      change.type = "button";
      change.textContent = "Change path";
      find(".setup").before(change);
      change.addEventListener("click",() => choose("opening","Change path selected."));
    }
  } else if (school || recipe || menu || pilot) {
    find(".school-ending").hidden = false;
    find("#question").hidden = true;
    find(".choices").hidden = true;
    if (menu || pilot) {
      stage.style.display = "none";
      stage.insertAdjacentHTML("afterend",pilot ? schoolPilotPages() : menuToCounterPages());
      find(".closing").textContent = pilot ? "You bring the experience and the care. DietLedger gives you a workspace to explore what’s possible." : "Explore how a connected workflow could support your team's preparation—then evaluate it against the realities of your kitchen, staffing, and service.";
      find(".next").innerHTML = (pilot ? "Plan a school-meal pilot" : "Begin with a pilot") + ' <span aria-hidden="true">→</span>';
      if (pilot) {
        for (const button of [find(".next"),find(".setup")]) button.setAttribute("aria-describedby","pilot-boundary");
        find(".next").addEventListener("click",requestSetup);
      } else {
        find(".next").addEventListener("click",() => choose("s4","Next scene requested · S4"));
      }
      const change = document.createElement("button");
      change.type = "button";
      change.textContent = "Change path";
      find(".setup").before(change);
      change.addEventListener("click",() => choose("opening","Change path selected."));
    } else if (recipe) {
      stage.style.display = "none";
      const papers = document.createElement("div");
      papers.className = "papers";
      papers.innerHTML = recipePages();
      stage.after(papers);
      find(".closing").textContent = "Give the idea of a better lunch something practical to stand on.";
      find(".next").innerHTML = 'Give the menu some shape <span aria-hidden="true">→</span>';
      find(".next").addEventListener("click",() => choose("s3","Next scene requested · S3"));
    } else {
      find(".meal-times").hidden = false;
      stage.setAttribute("viewBox","0 0 900 255");
      stage.removeAttribute("aria-hidden");
      stage.setAttribute("role","img");
      const renderMeal = () => {
        stage.setAttribute("aria-label",meal==="lunch" ? "Lunch trays with mini pizza, grapes and broccoli; a sandwich, an apple and carrot sticks; and chicken with rice and cucumber, pear slices and sweet corn." : "Breakfast trays with pancakes, strawberries and banana slices; an egg sandwich, mandarin and roasted potatoes; and blueberry oatmeal, apple wedges and yogurt.");
        stage.innerHTML = schoolStage(meal);
        all("[data-meal]").forEach(button => button.setAttribute("aria-pressed",String(button.dataset.meal===meal)));
      };
      renderMeal();
      all("[data-meal]").forEach(button => button.addEventListener("click",() => {
        if (meal===button.dataset.meal) return;
        skip();
        meal = button.dataset.meal;
        renderMeal();
        replay();
      }));
      find(".next").addEventListener("click",() => choose(config.nextSchoolPath,"Selected · Start behind the meal"));
    }
  } else {
    const items = branches ? DESTINATIONS : MEALS;
    host.style.setProperty("--columns",items.length);
    find("h2").textContent = branches ? "Where does your care take shape?" : "Who are you planning for?";
    const height = branches ? Math.ceil(209*config.branchTableScale+57+176*config.destinationScale+14) : 290;
    stage.setAttribute("viewBox",`0 0 900 ${height}`);
    stage.innerHTML = branches ? branchStage(config) : sharedTable(config.plateScale);
    for (const item of items) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.dataset.path = item.key;
      button.setAttribute("aria-pressed","false");
      const portrait = branches
        ? `<svg class="portrait" viewBox="${item.view}" aria-hidden="true"><g class="mini"><use href="#${item.art}"/></g></svg>`
        : `<svg class="portrait" viewBox="-65 -53 130 106" role="img" aria-label="${item.meal}">
             <g class="mini"><use href="#dish-${item.key}" transform="scale(1 .72)"/></g></svg>`;
      button.innerHTML = `${portrait}<span class="arrow" aria-hidden="true">↗</span>
        <span class="label">${item.title}</span><span class="desc">${item.text}</span>`;
      button.addEventListener("click",() => {
        all(".choice").forEach(other => other.setAttribute("aria-pressed",String(other===button)));
        choose(item.key,`Path chosen · ${item.title}`);
      });
      find(".choices").append(button);
    }
  }

  // Final artwork is the base DOM. Animation uses backwards fill during
  // delays, so Skip, a motion-preference change, or teardown finishes at once.
  function play(element,frames,start,length) {
    const animation = element.animate(frames,{
      delay:start*beat, duration:length*beat, fill:"backwards",
      easing:"cubic-bezier(.24,.65,.26,1)"
    });
    animations.add(animation);
    animation.onfinish = () => animations.delete(animation);
  }
  const fade = [{opacity:0},{opacity:1}];
  const draw = [{strokeDashoffset:"1"},{strokeDashoffset:"0"}];

  function replaySchool() {
    play(find(".drop"),draw,0,.6);
    const table = find(".unfold");
    table.style.transformBox = "fill-box";
    table.style.transformOrigin = "50% 0%";
    play(table,[
      {opacity:0,transform:"scale(.93,.74)"},
      {opacity:1,transform:"scale(.99,.97)",offset:.74},
      {opacity:1,transform:"scale(1)"}
    ],.45,.95);
    all(".lunch-serving").forEach((meal,index) => {
      play(meal,[
        {opacity:0,transform:"translateY(-8px)"},
        {opacity:1,transform:"translateY(-1px)",offset:.78},
        {opacity:1,transform:"none"}
      ],1.25+index*.22,.68);
    });
  }
  function replayBranches() {
    play(find(".trunk"),draw,.12,.48);
    const arms = all(".arm"), settings = all(".destination");
    const dots = all(".terminal"), minis = all(".mini");
    arms.forEach((arm,index) => {
      const start = .58+index*.97;
      play(arm,draw,start,1.02);
      play(settings[index],fade,start+.77,.78);
      play(dots[index],fade,start+.91,.32);
      play(minis[index],fade,2.98+index*.12,.46);
    });
  }
  function replayOpening() {
    play(find(".brand"),fade,0,.55);
    play(find("header"),[{opacity:0,transform:"translateY(5px)"},{opacity:1,transform:"none"}],.08,.72);
    play(find(".trace"),draw,.65,1.05);
    play(find(".furniture"),[{opacity:0,transform:"translateY(5px)"},{opacity:1,transform:"none"}],.99,.92);
    all(".utensils").forEach(item => play(item,fade,1.55,.46));
    const lights = all(".glow");
    all(".served").forEach((plate,index) => {
      const start = 1.85+index*.34;
      const dx = [-23,0,23][index];
      play(lights[index],fade,start-.12,.75);
      play(plate,[
        {opacity:0,transform:`translate(${dx}px,-17px) rotate(${dx*.18}deg)`},
        {opacity:1,transform:"translate(0,-2px) rotate(0deg)",offset:.78},
        {opacity:1,transform:"none"}
      ],start,.78);
    });
    all(".mini").forEach((mini,index) => play(mini,[
      {opacity:0,transform:"translateY(-13px) scale(.88)"},
      {opacity:1,transform:"translateY(-1px) scale(1)",offset:.8},
      {opacity:1,transform:"none"}
    ],3.35+index*.16,.66));
  }
  function replay() {
    skip();
    if (motion.matches || !beat || !host.animate) return;
    if (hosting) {
      const settle = [{opacity:.7,transform:"translateY(4px)"},{opacity:1,transform:"none"}];
      play(stage,settle,0,.65);
      all(".choice").forEach((card,i)=>play(card,settle,.52+i*.16,.58));
      if (!find("#beginner-guide").hidden) {
        play(find(".machine-art"),settle,1.12,.7);
        play(find(".host-wire"),draw,1.75,.75);
        play(find(".browser-art"),settle,2.25,.65);
      }
    } else if (pilot) {
      const settle = [{opacity:.65,transform:"translateY(6px)"},{opacity:1,transform:"none"}];
      play(find(".pilot-table"),settle,0,.85);
      all(".pilot-plan .menu-leaf").forEach((card,i)=>play(card,settle,.7+i*.2,.7));
      play(find(".pilot-review"),settle,1.65,.7);
      play(find(".pilot-folio"),[{transform:"scale(.991)"},{transform:"none"}],2.45,.75);
    } else if (menu) {
      const settle = [{transform:"translateY(-7px)",opacity:.78},{transform:"none",opacity:1}];
      all(".menu-leaf").forEach((leaf,i) => play(leaf,settle,i*.25,.85));
      all(".serving-mark").forEach((mark,i) => play(mark,fade,.9+i*.18,.5));
      all(".connector .wire").forEach((wire,i) => play(wire,draw,1.55+i*.45,.55));
      all(".list-slip dl div").forEach((row,i) => play(row,settle,2.22+i*.09,.52));
      play(find(".prep-surface"),[{transform:"translateY(4px)",opacity:.3},{transform:"none",opacity:1}],2.88,.78);
    } else if (recipe) {
      all(".ingredient").forEach((item,i) => play(item,[
        {transform:`translate(${i ? 10 : -10}px,-5px)`,opacity:.4},{transform:"none",opacity:1}
      ],i*.12,.8));
      play(find(".leaf"),[{transform:"perspective(800px) rotateY(-6deg)"},{transform:"none"}],.6,.9);
      play(find(".connector .wire"),draw,1.35,.65);
      play(find(".nutrition"),[{transform:"translateX(-7px)",opacity:.82},{transform:"none",opacity:1}],1.85,.85);
    } else if (school) replaySchool();
    else if (branches) replayBranches();
    else replayOpening();
  }
  function onMotionChange() { if (motion.matches) skip(); }
  find('[data-action="replay"]').addEventListener("click",replay);
  find('[data-action="skip"]').addEventListener("click",requestSetup);
  find('[data-action="restart"]').addEventListener("click",() => { skip(); restartAdventure(); });
  find('[data-action="back"]').addEventListener("click",() => {
    skip();
    if (options.onBack) options.onBack();
    else find(".status").textContent = kind==="opening" ? "You’re at the opening table." : "Back selected.";
  });
  function requestSetup() {
    skip();
    if (hosting && !options.onSetup) {
      find(".choice[aria-pressed=true]").focus();
      return;
    }
    if (pilot && !options.onSetup) {
      choose("setup","Preview · Setup requested for the school-meal pilot.");
      return;
    }
    find(".status").textContent = "Set up DietLedger selected.";
    options.onSetup?.();
  }
  find('[data-action="setup"]').addEventListener("click",requestSetup);
  motion.addEventListener("change",onMotionChange);
  container.append(host);
  replay();
  return {
    replay, skip,
    getMeal() { return meal; },
    focusNext() { find(".next").focus({preventScroll:true}); },
    focusHeading() { find("h1").focus(); },
    focusPath(key) { all(".choice").find(button => button.dataset.path===key)?.focus({preventScroll:true}); },
    destroy() {
      skip();
      motion.removeEventListener("change",onMotionChange);
      host.remove();
    }
  };
}

// Standalone routing. Returning restores focus to the originating button.
// A host application can supply its own callbacks instead.
const preview = document.getElementById("preview");
let scene;

function showOpening(returning=false) {
  scene?.destroy();
  scene = mountThreeLights(preview,{
    onChoose(path) { if (path==="care") showBranches(); }
  });
  if (returning) { scene.skip(); scene.focusPath("care"); }
}
function showBranches(returning=false) {
  scene?.destroy();
  scene = mountCareBranches(preview,{
    onBack:() => showOpening(true),
    onChoose(path) { if (path==="schools") showSchool(); }
  });
  if (returning) { scene.skip(); scene.focusPath("schools"); }
  else scene.focusHeading();
}
function showSchool(returning=false,meal="lunch") {
  scene?.destroy();
  scene = mountSchoolDay(preview,{
    meal, onBack:() => showBranches(true),
    onSetup:() => { const selected = scene.getMeal(); showSetup(selected, () => showSchool(true,selected)); },
    onChoose(path) { if (path===SETTINGS.nextSchoolPath) showRecipe(scene.getMeal()); }
  });
  if (returning) { scene.skip(); scene.focusNext(); return; }
  scene.focusHeading();
}
function showRecipe(meal,returning=false) {
  scene?.destroy();
  scene = mountRecipeConversation(preview,{
    onBack:() => showSchool(true,meal),
    onSetup:() => showSetup(meal, () => showRecipe(meal,true)),
    onChoose(path) { if (path==="s3") showMenu(meal); }
  });
  if (returning) { scene.skip(); scene.focusNext(); return; }
  scene.focusHeading();
}
function showMenu(meal,returning=false) {
  scene?.destroy();
  scene = mountMenuToCounter(preview,{
    onBack:() => showRecipe(meal,true),
    onSetup:() => showSetup(meal, () => showMenu(meal,true)),
    onChoose(path) {
      if (path==="s4") showPilot(meal);
      else if (path==="opening") showOpening(true);
    }
  });
  if (returning) { scene.skip(); scene.focusNext(); return; }
  scene.focusHeading();
}
function showPilot(meal,returning=false) {
  scene?.destroy();
  scene = mountSchoolPilot(preview,{
    onBack:() => showMenu(meal,true),
    onSetup:() => showSetup(meal),
    onChoose(path) {

// Additional journey scenes. The original preview above is deliberately unchanged.
// All illustrations run locally using the same shadow-root artwork and native Web Animations.
const ADDITIONAL_SCENES = {...PERSONAL_SCENES, ...FAMILY_SCENES, ...CARE_SCENES};
const ADDITIONAL_ROUTES = {personal:['p1','p2','p3','p4'], family:['f1','f2','f3','f4'], care:['c1','c2','c3','c4']};
let adventureRoute = null;

function mountAdventureChapter(container, key, options = {}) {
  const content = ADDITIONAL_SCENES[key];
  const host = document.createElement('div');
  const root = host.attachShadow({mode:'open'});
  root.append(document.querySelector('#ledger-art').content.cloneNode(true));
  root.append(document.querySelector('#ledger-shell').content.cloneNode(true));
  for (const setting of ['emerald','cream','copper','width','heading','lunchWidth']) host.style.setProperty('--'+setting, SETTINGS[setting]);
  const find = selector => root.querySelector(selector);
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const animations = new Set();
  const book = find('.book');
  book.classList.add('adventure-chapter');
  const styles = document.createElement('style');
  styles.textContent = `
    .adventure-chapter header p {max-width:48rem;line-height:1.65}
    .adventure-chapter .scene-content {max-width:57rem;margin:auto}
    .adventure-chapter .stage {display:none}
    .adventure-chapter .story-art {margin:clamp(18px,3cqi,32px) auto;max-width:57rem}
    .adventure-chapter .story-art svg {display:block;width:100%;height:auto}
    .adventure-chapter .story-art svg.c-link {width:40px;height:40px}
    .adventure-chapter .story-art .wire {stroke:#ab7144}
    .adventure-chapter .story-art .sheet {height:auto}
    .adventure-chapter .story-art p {line-height:1.55}
    .adventure-chapter .scene-content .choices,.adventure-chapter #question {display:none}
    .adventure-chapter .school-ending {display:block}
    .adventure-chapter .closing {max-width:48rem;line-height:1.6}
    .adventure-chapter .story-art a {color:#285642}
    @container(max-width:640px) {.adventure-chapter .story-art {margin-block:14px}.adventure-chapter .story-art .papers {grid-template-columns:1fr}}
  `;
  root.append(styles);
  find('h1').innerHTML = content.headline;
  const intro = document.createElement('p');
  intro.textContent = content.intro;
  find('header').append(intro);
  const art = document.createElement('div');
  art.className = 'story-art';
  art.innerHTML = content.markup;
  find('.stage').after(art);
  find('#question').hidden = true;
  find('.choices').hidden = true;
  find('.school-ending').hidden = false;
  find('.closing').textContent = content.closing;
  const careLabels = {c1:'Give the details room', c2:'Turn attention into a plan', c3:'Create room for thoughtful care', c4:'Explore a care-planning pilot'};
  find('.next').textContent = (careLabels[key] || content.next) + ' →';
  find('.status').textContent = '';
  find('.next').addEventListener('click', () => { skip(); options.onNext(); });
  const change = document.createElement('button');
  change.type = 'button'; change.textContent = 'Change path';
  find('.setup').before(change);
  change.addEventListener('click', () => { skip(); showOpening(true, adventureRoute === 'care' ? 'care' : adventureRoute); });
  find('[data-action="back"]').addEventListener('click', () => { skip(); options.onBack(); });
  find('[data-action="setup"]').addEventListener('click', () => { skip(); options.onSetup(); });
  find('[data-action="replay"]').addEventListener('click', replay);
  find('[data-action="skip"]').addEventListener('click', () => { skip(); options.onSetup(); });
  find('[data-action="restart"]').addEventListener('click', () => { skip(); restartAdventure(); });
  function skip() { for (const animation of animations) animation.cancel(); animations.clear(); }
  function replay() {
    skip();
    if (motion.matches || typeof host.animate !== 'function') return;
    // Each scene's layers tell its own sequence; SVG wrappers retain original art transforms.
    const entries = {
      p1:['translateX(-35px)','translateY(12px)','translateX(-30px)','translateX(30px)'],
      p2:['translateX(-35px)','translateX(35px)','translateY(28px) scale(.95)'],
      p3:['translateX(-35px)','scale(.95)','translateX(-15px)','translateX(30px)'],
      p4:['translateY(15px)','scaleX(.5)','scale(.88)','translateX(32px)'],
      f1:['scale(.92)','translateX(-30px)','translateX(30px)','translateY(-15px)'],
      f2:['translateX(-18px)','translateX(18px)','scale(.94)'],
      f3:['translateX(-30px)','scaleX(.55)','translateX(28px)'],
      f4:['rotate(-3deg)','rotate(4deg) scale(.96)','scaleX(.6)'],
      c1:['translateX(-30px)','translateX(30px)','translateY(12px)'],
      c2:['translateX(-18px)','translateY(10px)','translateX(18px)'],
      c3:['translateX(-18px)','scaleX(.6)','translateX(18px)'],
      c4:['translateX(-16px)','translateX(16px)']
    };
    root.querySelectorAll('.adventure-animate').forEach((el, i) => {
      const effect = (entries[key] || [])[i] || 'translateY(8px)';
      const svgLayer = el.namespaceURI === 'http://www.w3.org/2000/svg' && el.localName !== 'svg';
      const frames = svgLayer
        ? [{opacity:.05, transform:effect},{opacity:1, transform:'none'}]
        : [{opacity:.05},{opacity:1}];
      const animation = el.animate(frames, {delay:Math.min(i,5)*180, duration:700, fill:'backwards', easing:'cubic-bezier(.24,.65,.26,1)'});
      animations.add(animation);
      animation.onfinish = () => animations.delete(animation);
    });
  }
  const onMotionChange = () => { if (motion.matches) skip(); };
  motion.addEventListener('change', onMotionChange);
  // Wrap SVG targets so WAAPI transforms cannot replace an illustration's own
  // SVG transform attribute. Underlying artwork remains at its settled position.
  art.querySelectorAll('.adventure-animate').forEach(el => {
    if (el.namespaceURI !== 'http://www.w3.org/2000/svg' || el.localName === 'svg') return;
    const wrapper = document.createElementNS('http://www.w3.org/2000/svg','g');
    el.before(wrapper);
    wrapper.append(el);
    el.classList.remove('adventure-animate');
    wrapper.classList.add('adventure-animate');
  });
  container.append(host);
  replay();
  return {
    skip, replay,
    focusHeading() {find('h1').focus();},
    focusNext() {find('.next').focus();},
    destroy() {skip(); motion.removeEventListener('change', onMotionChange); host.remove();}
  };
}

function showAdventureChapter(route, index, returning = false) {
  adventureRoute = route;
  scene?.destroy();
  scene = mountAdventureChapter(preview, ADDITIONAL_ROUTES[route][index], {
    onBack() {
      if (index > 0) showAdventureChapter(route,index-1,true);
      else if (route === 'care') showBranches(true,'care');
      else showOpening(true,route);
    },
    onNext() {
      if (index < 3) showAdventureChapter(route,index+1);
      else showAdventureSetup(route,index);
    },
    onSetup() {showAdventureSetup(route,index);}
  });
  if (returning) {scene.skip(); scene.focusNext();} else scene.focusHeading();
}

function showAdventureSetup(route, returnIndex, onBack = () => showAdventureChapter(route,returnIndex,true)) {
  adventureRoute = route;
  const isCare = route === 'care';
  const arrival = isCare ? {
    headline:'Begin with a small, thoughtful pilot.',
    introduction:'Bring together the people responsible for nutrition, care, preparation, privacy, and IT to plan your workspace.',
    hosting:'DietLedger is a self-hosted beta. You provide the hosting and must assess its suitability for your setting.',
    prompt:'How would you like to begin?'
  } : {
    headline:'Now make it yours.',
    introduction:'Your data is yours. Your recipes, plans, and food logs live on the machine where you choose to host DietLedger.',
    hosting:'DietLedger does not sell your data to advertisers. You control your self-hosted beta instance, including access, security, and backups.',
    prompt:'How would you like to begin?'
  };
  scene?.destroy();
  scene = mountChooseSetup(preview, {
    arrival,
    hideChangePath: returnIndex === 3,
    onBack,
    onChoose(path) {if (path === 'opening') showOpening(true, route === 'care' ? 'care' : route);}
  });
  const root = preview.lastElementChild.shadowRoot;
  const buttons = [...root.querySelectorAll('.choices .choice')];
  if (!isCare) {
    buttons[0].querySelector('.label').textContent = 'Guide me through self-hosting';
    buttons[0].querySelector('.desc').textContent = 'Explain what I need and what I will be running.';
    buttons[1].querySelector('.label').textContent = 'Show me the technical steps';
    buttons[1].querySelector('.desc').textContent = 'See installation requirements and commands.';
    root.querySelector('#technical-guide p').textContent = 'Review installation requirements and commands before building your instance.';
  }
  const boundary = root.querySelector('.setup-materials .pilot-boundary');
  boundary.textContent = isCare
    ? 'Beta software, not a clinical system or a substitute for individualized care. Independently verify therapeutic diets, allergies, texture needs, and safety. Review organizational policy and privacy obligations before deployment.'
    : 'Beta software. Nutrition information depends on the data available and is not medical advice. Maintain access controls, updates, and tested backups for your own instance.';
  root.querySelector('h1').focus();
}

// Preserve the existing opening and care-branch components, adding only the missing choices.
showOpening = function(returning = false, returnPath = 'care') {
  adventureRoute = null;
  scene?.destroy();
  scene = mountThreeLights(preview, {
    onSetup:() => showAdventureSetup('personal',0,() => showOpening(true)),
    onChoose(path) {
      if (path === 'care') showBranches();
      else if (path === 'personal' || path === 'family') showAdventureChapter(path,0);
    }
  });
  if (returning) {scene.skip(); scene.focusPath(returnPath);}
};
showBranches = function(returning = false, returnPath = 'schools') {
  scene?.destroy();
  scene = mountCareBranches(preview, {
    onBack:() => showOpening(true),
    onSetup:() => showAdventureSetup('personal',0,() => showBranches(true)),
    onChoose(path) {
      if (path === 'schools') showSchool();
      else if (path === 'care') showAdventureChapter('care',0);
    }
  });
  if (returning) {scene.skip(); scene.focusPath(returnPath);} else scene.focusHeading();
};
showOpening();

</script>

[package]
name = "nutrilabel"
version = "1.0.0-beta.14"
description = "NutriLabel - Recipe Storage with FDA Nutrition Labels"
authors = ["NutriLabel"]
edition = "2021"

[lib]
name = "nutrilabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

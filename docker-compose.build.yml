services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_DIETLEDGER_LOCAL_ONLY: ${NEXT_PUBLIC_DIETLEDGER_LOCAL_ONLY:-false}
    image: recipetool-dietledger
    container_name: dietledger

  api:
    build:
      context: ./sync-server
      args:
        BUILD_VERSION: ${APP_VERSION:-dev}
    image: recipetool-api
    container_name: dietledger-api
